services:
    app:
        build:
            context: .
            dockerfile: docker/8.4/Dockerfile
        container_name: online_shop_app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./:/var/www
        depends_on:
            - postgres
        networks:
            - online_shop

    nginx:
        image: nginx:alpine
        container_name: online_shop_nginx
        restart: unless-stopped
        ports:
            - "80:80"
        volumes:
            - ./:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - online_shop

    postgres:
        image: postgres:16
        container_name: online_shop_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: laravel
            POSTGRES_USER: laravel
            POSTGRES_PASSWORD: password
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - online_shop

    node:
        build:
            context: .
            dockerfile: docker/node/Dockerfile
        container_name: online_shop_node
        working_dir: /var/www
        volumes:
            - ./:/var/www
        ports:
            - "5173:5173"
        command: npm run dev -- --host 0.0.0.0
        networks:
            - online_shop

volumes:
    postgres_data:

networks:
    online_shop:
